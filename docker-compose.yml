# Local dev convenience: brings up backend + frontend together.
# docker-compose up  ->  API on :8000, Streamlit on :8501
version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/code/data
      - ./logs:/code/logs
    command: uvicorn wsgi:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - backend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
